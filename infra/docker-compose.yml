version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: specsentinel-db
    environment:
      POSTGRES_USER: specsentinel
      POSTGRES_PASSWORD: specsentinel
      POSTGRES_DB: specsentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specsentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: specsentinel-backend
    environment:
      - DATABASE_URL=postgresql://specsentinel:specsentinel@db:5432/specsentinel
      - SECRET_KEY=change-this-in-production-use-openssl-rand-hex-32
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - FILE_STORAGE_PATH=/app/uploads
      - ENV=dev
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - USE_LLM_EXTRACTION=true
    volumes:
      - ../backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: specsentinel-frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  uploads_data:
